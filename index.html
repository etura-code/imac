<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Imac</title>

    <link rel="icon" type="image/png" href="ImacLogo.png" class="rounded-full">


    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Smooth transition for the mobile side menu */
        #mobile-menu {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-800 antialiased">
    
    <header class="fixed top-6 left-0 w-full z-50">
        <nav class="relative w-[90%] md:w-[80%] mx-auto bg-white/10 backdrop-blur-md border border-white/20 flex justify-between h-[70px] items-center px-6 md:px-8 shadow-2xl rounded-full">
            
            <div class="logo w-[90px] h-[90px] md:w-[110px] md:h-[110px] rounded-full overflow-hidden border-4 border-white bg-white shadow-xl hover:scale-105 transition-all duration-300 flex-shrink-0 z-50">
                <a href="index.html">
                    <img src="ImacLogo.png" class="w-full h-full object-cover" alt="Logo" onerror="this.src='https://via.placeholder.com/100?text=LOGO'">
                </a>
            </div>

            <div class="hidden md:block">
                <ul class="flex items-center gap-8 text-white font-bold uppercase text-xs tracking-widest">
                    <li><a href="index.html" class="hover:text-blue-400 transition-colors">Home</a></li>
                    <li><a href="services.html" class="hover:text-blue-400 transition-colors">Services</a></li>
                    
                    <li class="group relative py-6"> 
                        <a href="projects.html" class="hover:text-blue-400 transition-colors flex items-center gap-1">
                            Projects <i class="fa-solid fa-chevron-down text-[10px] group-hover:rotate-180 transition-transform"></i>
                        </a>
                        <ul class="absolute hidden group-hover:block bg-white text-gray-800 top-full left-0 shadow-2xl w-48 rounded-xl overflow-hidden mt-2">
                            <li><a href="#" class="block px-5 py-3 hover:bg-blue-50 hover:text-blue-600 transition">Construction</a></li>
                            <li><a href="#" class="block px-5 py-3 hover:bg-blue-50 hover:text-blue-600 transition">Architecture</a></li>
                        </ul>
                    </li>

                    <li><a href="about.html" class="hover:text-blue-400 transition-colors">About</a></li>
                    <li><a href="contact.html" class="bg-blue-600 px-5 py-2 rounded-full hover:bg-blue-700 transition shadow-lg">Contact</a></li>
                </ul>
            </div>

            <button onclick="toggleMenu()" class="md:hidden text-white text-2xl focus:outline-none p-2">
                <i id="menu-icon" class="fa-solid fa-bars-staggered"></i>
            </button>
        </nav>

        <div id="mobile-menu" class="fixed top-0 left-0 h-screen w-[280px] bg-blue-900 shadow-2xl transform -translate-x-full z-[60] md:hidden">
            <div class="p-8">
                <div class="flex justify-end mb-8">
                    <button onclick="toggleMenu()" class="text-white text-3xl">&times;</button>
                </div>
                <ul class="flex flex-col items-center  text-white font-bold uppercase text-lg gap-9">
                    <li><a href="index.html" onclick="toggleMenu()">Home</a></li>
                    <li><a href="services.html" onclick="toggleMenu()">Services</a></li>
                    <li><a href="projects.html" onclick="toggleMenu()">Projects <span><i class="fa-solid fa-chevron-down text-[10px] group-hover:rotate-180 transition-transform"></i></span></a></li>
                    <ul class="absolute  group-hover:block bg-white text-gray-800 top-full left-0 shadow-2xl w-48 rounded-xl overflow-hidden mt-2">
                            <li><a href="#" class="block px-5 py-3 hover:bg-blue-50 hover:text-blue-600 transition">Construction</a></li>
                            <li><a href="#" class="block px-5 py-3 hover:bg-blue-50 hover:text-blue-600 transition">Architecture</a></li>
                        </ul>


                    <li><a href="about.html" onclick="toggleMenu()">About Us</a></li>
                    <li><a href="contact.html" onclick="toggleMenu()" class="text-blue-300">Contact Us</a></li>
                </ul>
            </div>
        </div>
        <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 hidden z-[55] md:hidden"></div>
    </header>

    <main class="h-[200vh] pt-40 px-10">
        <section class="">
            
        </section>
    </main>

<script src="/index.js"></script>
</body>
</html>
